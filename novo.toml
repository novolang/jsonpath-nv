[package]
name        = "jsonpath-nv"
version     = "0.1.0"
description = "RFC 9535 JSONPath over the standard library's JSON value: the whole grammar as a typed query including filter expressions, the well-typedness rules of section 2.4.3 checked at parse time, a total evaluator answering a nodelist with normalized paths under bounds the caller sets, the five function extensions, and the I-Regexp (RFC 9485) patterns match() and search() take."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.  The JSONPath Compliance Test Suite is its oracle.
stability   = "experimental"

# `core`: a parse of a string the caller typed, and a walk over a value
# the caller already parsed.  No function declares an effect.
layer       = "core"

category    = "data"

tags        = ["jsonpath", "rfc9535", "json", "query", "iregexp", "rfc9485", "sans-io"]
repository  = "https://github.com/novolang/jsonpath-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Selecting from a JSON document by RFC 9535"

[dependencies]
# None.  The document is the standard library's `std.json` value, so a
# caller queries a document where it is, without converting it.  The
# Unicode general categories that I-Regexp's `\p{...}` needs arrive as a
# function the caller supplies, from unicode-nv or elsewhere, and
# `std.regex` is a different pattern language.
